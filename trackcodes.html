<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Table Page</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">5×9 Table Example</h2>

    <table>
        <tr>
            <th>Track type</th>
            <th>UP</th>
            <th>DOWN</th>
            <th>REVERSIBLE/BIDIRECTIONAL</th>
            <th>LOOP</th>
        </tr>

        <!-- 9 table rows -->
        <tr><td>MAIN/FAST</td><td>1100</td><td>2100</td><td>3100</td><td>4100</td></tr>
        <tr><td>SLOW</td><td>1200</td><td>2200</td><td>3200</td><td>4200</td></tr>
        <tr><td>GOODS</td><td>1300</td><td>2300</td><td>3300</td><td>4300</td></tr>
        <tr><td>SINGLE</td><td>1400</td><td>2400</td><td>3400</td><td>4400</td></tr>
        <tr><td>LOOP</td><td>1500</td><td>2500</td><td>3500</td><td>4500</td></tr>
        <tr><td>TERMINAL</td><td>1600</td><td>2600</td><td>3600</td><td>4600</td></tr>
        <tr><td>CROSSOVER</td><td>1700</td><td>2700</td><td>3700</td><td>4700</td></tr>
        <tr><td>OTHER/ENGINE</td><td>1800</td><td>2800</td><td>3800</td><td>4800</td></tr>
        <tr><td>SIDING</td><td>1900</td><td>2900</td><td>3900</td><td>4900</td></tr>
    </table>

</body>
</html>
